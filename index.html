*{box-sizing:border-box}

header.top h1{font-size:23px;line-height:1;white-space:nowrap}
header.top .club{margin:3px 0 0;font-size:13px;font-weight:600;color:var(--mute);letter-spacing:.02em}
header.top .sub{margin:1px 0 0;font-size:12px;color:var(--mute)}
header.top .sub:empty{display:none}
.gear{margin-left:auto;flex:none;width:40px;height:40px;min-height:0;padding:0;border-radius:12px;border:0!important;background:var(--soft)!important;color:var(--ink)!important;display:flex;align-items:center;justify-content:center;z-index:1}
.gear.on{background:var(--pri)!important;color:var(--pri-ink)!important}
main{padding:4px 14px;max-width:640px;margin:0 auto;position:relative}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0;box-shadow:var(--sh)}
.blk{border-left:3px solid var(--pri)}
.blk h3{font-size:21px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.blk h3 small{font:500 13px Barlow,sans-serif;color:var(--mute)}
.ex{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-height:52px}
.ex:first-of-type{border-top:0}.ex.done span{color:var(--mute)}

button{border:0;background:var(--soft);border-radius:12px;padding:9px 14px;min-height:44px;font-weight:600;cursor:pointer;transition:transform .1s,filter .15s}
button:active{transform:scale(.97)}
button.pri{background:var(--pri);color:var(--pri-ink)}
button.sm{padding:5px 12px;min-height:38px;font-size:14px}
input,select{width:100%;min-height:46px;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sea);box-shadow:0 0 0 3px rgba(59,78,156,.15)}
label{font-size:13px;font-weight:600;color:var(--mute);display:block;margin:10px 0 4px}
textarea{width:100%;min-height:90px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px;font:12px monospace}
a{color:var(--sea)}

nav button{flex:1;min-width:0;border-radius:0;min-height:62px;background:none;font-weight:600;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;box-shadow:none}

nav button.fab span{color:var(--ink)}

.row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd{color:var(--mute);font-size:13px;margin-top:10px}
.flex{display:flex;gap:8px}.flex>*{flex:1}
.empty{color:var(--mute);padding:16px 6px;text-align:center}
.chart{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:22px;z-index:40;font-weight:600;box-shadow:var(--sh)}

.nm{flex:1;min-width:0}.tip{font-size:13px;color:var(--mute)}.tip summary{cursor:pointer;display:inline-block;padding:2px 0}.tip p{margin:2px 0 4px}

.kick{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}

.cw{position:relative}.ctip{position:absolute;top:4px;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 10px;border-radius:10px;white-space:nowrap;display:none;z-index:2}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:6px}.leg i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
