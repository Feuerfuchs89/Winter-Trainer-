<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>Kutter Winter-Training</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10303B"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kutter">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--c1:#0089A0;--c2:#B87700;--c3:#7A4FB0;--c4:#C8402F;--bg:#E8EFEF;--card:#fff;--ink:#10303B;--mute:#5B7480;--line:#C9D7DA;--acc:#E9A800;--acc-ink:#10303B;--sea:#0F6E7A;--red:#C8402F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#2AA8BA;--c2:#BF8A12;--c3:#A487E6;--c4:#E06A58;--bg:#0E2A33;--card:#16394A;--ink:#EAF3F4;--mute:#93AEB8;--line:#2A5163;--sea:#5FC2CE;--red:#FF8A78}}
:root[data-theme="dark"]{--c1:#2AA8BA;--c2:#BF8A12;--c3:#A487E6;--c4:#E06A58;--bg:#0E2A33;--card:#16394A;--ink:#EAF3F4;--mute:#93AEB8;--line:#2A5163;--sea:#5FC2CE;--red:#FF8A78}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:84px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0;font-weight:700;letter-spacing:.01em}
header{display:flex;align-items:center;gap:12px;padding:16px 16px 6px}.logo{width:54px;height:54px;flex:none}.logo svg{display:block;width:100%;height:100%}h1{font-size:30px;line-height:1.05}header p{margin:0;color:var(--mute);font-size:14px}
main{padding:8px 14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.blk{border-left:5px solid var(--sea)}
.blk h3{font-size:21px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.blk h3 small{font:500 13px Barlow,sans-serif;color:var(--mute)}
.ex{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
button,select,input{font:inherit;color:var(--ink)}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;min-height:40px}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.sm{padding:4px 10px;min-height:32px;font-size:14px}
input,select{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
label{font-size:14px;color:var(--mute);display:block;margin:8px 0 3px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-width:0;border:0;border-radius:0;min-height:60px;background:none;font-weight:600;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px}
nav button.on{color:var(--ink);box-shadow:inset 0 4px 0 var(--acc)}
.row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;align-items:center;margin:6px 0}
.row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd{color:var(--mute);font-size:13px;margin-top:10px}
.flex{display:flex;gap:8px}.flex>*{flex:1}
.empty{color:var(--mute);padding:14px 4px}
.chart{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;z-index:9}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px 4px;border-top:1px solid var(--line);text-align:left}
textarea{width:100%;min-height:90px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px monospace}
.prog b{font-size:15px}.bar{height:8px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .3s}
.ex{min-height:48px}.ex.done span{color:var(--mute)}button.sm{min-height:38px}button:active{transform:scale(.97)}
.nm{flex:1;min-width:0}.tip{font-size:13px;color:var(--mute)}.tip summary{cursor:pointer;display:inline-block;padding:2px 0}.tip p{margin:2px 0 4px}
details.card summary{font-weight:600;cursor:pointer}.at{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.at button{min-height:38px;padding:4px 14px;border-radius:19px}.at button.on{background:var(--sea);color:var(--bg);border-color:var(--sea)}
.lr{border-top:1px solid var(--line);padding:8px 0}.lr:first-of-type{border-top:0}.lr .f{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px}.lr label{margin:4px 0 2px;font-size:12px}
.stp{display:grid;grid-template-columns:44px 1fr 44px;gap:4px}.stp button{padding:0;min-height:42px;font-size:22px}.stp input{text-align:center;padding:8px 2px}.last{font-size:12px;color:var(--mute)}
#tm{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:none;text-align:center}
#tm.on{display:block}#tm .big{font:700 76px/1.1 "Barlow Condensed",sans-serif}#tm .ph{font:700 24px "Barlow Condensed",sans-serif}#tm .flex{margin-top:12px}#tm button{background:var(--bg);color:var(--ink)}#tm button.pri{background:var(--acc);color:var(--acc-ink)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;color:var(--mute)}.wk i{display:block;height:32px;line-height:30px;border-radius:6px;border:1px solid var(--line);font-style:normal;font-size:16px}.wk i.y{background:var(--sea);border-color:var(--sea);color:var(--bg)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.tile b{display:block;font:700 30px/1.05 "Barlow Condensed",sans-serif}.tile span{font-size:13px;color:var(--mute)}
.stand{border-left:5px solid var(--acc)}.stand h3{font-size:24px}.stand ul{margin:8px 0 0;padding-left:20px}.stand li{margin:4px 0}.stand .kick{color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.pb{display:grid;grid-template-columns:1fr 84px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}.pb:first-of-type{border-top:0}.pb.on .nm span{font-weight:700}.pb.on{box-shadow:inset 4px 0 0 var(--acc);padding-left:8px}
.chip{font-size:13px;font-weight:600;padding:2px 8px;border-radius:12px;border:1px solid var(--line);white-space:nowrap}.chip.up{border-color:var(--sea);color:var(--sea)}.chip.dn{border-color:var(--red);color:var(--red)}
.cw{position:relative}.ctip{position:absolute;top:4px;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:5px 9px;border-radius:8px;white-space:nowrap;display:none;z-index:2}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:6px}.leg i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
</style></head><body>
<header><div class="logo" id="lg"></div><div><h1>Kutter Winter-Training</h1><p id="sub">Kraftausdauer · Nur auf diesem Gerät gespeichert</p></div></header>
<main id="m"></main>

<script>
var CATS={warm:["Warm-up, Tabata & Athletik","15 Min"],tabata:["Tabata","8 × 20 s / 10 s"],calis:["Calisthenics Beine & Rücken","Kraftausdauer"],knoten:["Station Knoten","30 Min"],wurf:["Station Wurfleine","30 Min"],cool:["Cool-down","5–10 Min"],ergo:["Rudermaschine","2 Geräte"],hantel:["Langhantel","200 m entfernt"]};
var DEF=[["warm","Hampelmann","Wdh"],["warm","Skipping","s"],["warm","Kreuzheben-Mobilisation","Wdh"],["warm","Armkreisen & Hüftkreisen","s"],["warm","Lauf-ABC","s"],["warm","Hockstrecksprung","Wdh"],
["tabata","Burpees","Wdh"],["tabata","Mountain Climbers","Wdh"],["tabata","Skater Jumps","Wdh"],["tabata","High Knees","Wdh"],["tabata","Liegestütze","Wdh"],["calis","Medizinball Slam","Wdh"],["calis","Medizinball Russian Twist","Wdh"],["calis","Medizinball Wall Ball","Wdh"],
["calis","Kniebeugen","Wdh"],["calis","Ausfallschritte","Wdh"],["calis","Superman","Wdh"],["calis","Liegestütze","Wdh"],["calis","Wandsitz","s"],["calis","Brücke einbeinig","Wdh"],["calis","Plank","s"],["calis","Hüftheben","Wdh"],["calis","Rudern am Gurt","Wdh"],["calis","Klimmzüge","Wdh"],["calis","Klimmzüge Untergriff","Wdh"],["calis","Dips","Wdh"],["calis","Hängendes Knieheben","Wdh"],
["knoten","Palstek","Wdh"],["knoten","Webleinenstek","Wdh"],["knoten","Kreuzknoten","Wdh"],["knoten","Rundtörn mit zwei halben Schlägen","Wdh"],["knoten","Achtknoten","Wdh"],
["wurf","Wurfleine auf Ziel","Wdh"],["wurf","Wurfleine Weitwurf","Wdh"],["wurf","Wurfleine aufschießen","Wdh"],
["cool","Dehnen Rücken & Beine","s"],["cool","Atemübung","s"],["cool","Auslaufen","s"],
["ergo","Ergo 500 m","m"],["ergo","Ergo 1000 m","m"],["ergo","Ergo Intervall 1 Min","m"],["ergo","Ergo 10 Min Dauer","m"],
["hantel","Kreuzheben","Wdh"],["hantel","Rudern vorgebeugt","Wdh"],["hantel","Kniebeuge","Wdh"],["hantel","Schulterdrücken","Wdh"]];
var PICK={warm:3,tabata:2,calis:3,knoten:1,wurf:1,cool:2,ergo:1,hantel:1};
var ORDER=["warm","calis","knoten","wurf","cool","ergo","hantel"];
var NEW3=["Klimmzüge","Klimmzüge Untergriff","Dips","Hängendes Knieheben"];
var S,tab="home",sel={ex:"",ath:"",cat:"all"};
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function lib(id){return S.lib.filter(function(e){return e.id===id})[0]}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fd(s){var p=s.split("-");return p[2]+"."+p[1]+"."}
function toast(t){var e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},1800)}
function newPlan(cat){if(!S.plan)S.plan={};
 if(cat){S.plan[cat]=gen(cat)}else{var p={};ORDER.forEach(function(c){p[c]=gen(c)});S.plan=p}
 save();render()}
function goLog(id){sel.ex=id;sel.fp=1;tab="log";render()}
var IC={};(function(){var d={home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',plan:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',log:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/>',diary:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 8h6"/>',chart:'<path d="M4 20V4M4 20h16M8 15l4-4 3 3 5-6"/>',team:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 3-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4 2 4 5"/>'};for(var k in d)IC[k]='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d[k]+'</svg>'})();
function doneSet(){var t=today(),o={};S.logs.forEach(function(l){if(l.d===t)o[l.ex]=1});return o}
var LOGO='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#10303B"/><g fill="#EAF3F4" opacity=".75"><circle cx="118" cy="112" r="8"/><circle cx="404" cy="90" r="6"/><circle cx="84" cy="198" r="5"/><circle cx="438" cy="196" r="7"/></g><g fill="none" stroke-linecap="round" stroke-width="16"><path d="M70 412q46-34 92 0t92 0 92 0 92 0" stroke="#5FC2CE"/><path d="M70 458q46-34 92 0t92 0 92 0 92 0" stroke="#0F6E7A"/></g><g transform="translate(256 232) rotate(45)"><path d="M0-136V112" stroke="#EAF3F4" stroke-width="16" stroke-linecap="round"/><path d="M-22 74Q-32 128-18 166H18Q32 128 22 74Z" fill="#E9A800" stroke="#E9A800" stroke-width="6" stroke-linejoin="round"/><rect x="-11" y="-152" width="22" height="48" rx="11" fill="#5FC2CE"/></g><g transform="translate(256 232) rotate(-45)"><path d="M0-136V112" stroke="#EAF3F4" stroke-width="16" stroke-linecap="round"/><path d="M-22 74Q-32 128-18 166H18Q32 128 22 74Z" fill="#E9A800" stroke="#E9A800" stroke-width="6" stroke-linejoin="round"/><rect x="-11" y="-152" width="22" height="48" rx="11" fill="#5FC2CE"/></g><circle cx="256" cy="232" r="34" fill="none" stroke="#E9A800" stroke-width="10"/></svg>';
function setTab(t){tab=t;sel.fp=0;render()}
function vTeamLocal(){
 var h='<div class="card"><h3>Sportler</h3>'+(S.ath.length?S.ath.map(function(a){return'<div class="ex"><span>'+esc(a.name)+'</span><button class="sm" onclick="delAth(\''+a.id+'\')">Entfernen</button></div>'}).join(""):'<div class="empty">Noch niemand angelegt.</div>');
 h+='<div class="flex" style="margin-top:8px"><input id="na" placeholder="Name"><button class="pri" style="flex:0 0 auto" onclick="addAth()">Hinzufügen</button></div></div>';
 h+='<div class="card"><h3>Übung hinzufügen</h3><label>Name</label><input id="ne"><label>Block</label><select id="nc">'+ORDER.map(function(c){return'<option value="'+c+'">'+CATS[c][0]+'</option>'}).join("")+'</select><label>Körperbereich</label><select id="nr"><option value="untere">Untere Extremitäten</option><option value="obere">Obere Extremitäten</option><option value="rumpf">Rumpf / Core</option><option value="ganz" selected>Ganzkörper &amp; Sonstige</option></select><label>Gemessen in</label><select id="nu"><option value="Wdh">Wiederholungen</option><option value="s">Sekunden</option><option value="m">Meter</option></select><label>Gewicht</label><select id="nw"><option value="1">Körpergewicht (+ Zusatzgewicht)</option><option value="0">Hantel / Gerät (Gesamtgewicht)</option></select><button class="pri" style="width:100%;margin-top:10px" onclick="addEx()">Übung speichern</button></div>';
 h+='<div class="card"><h3>Datensicherung</h3><p style="color:var(--mute);font-size:14px;margin:4px 0">Die Daten liegen nur in diesem Browser. Kopiere den Text als Sicherung oder füge eine Sicherung ein.</p><textarea id="bk">'+esc(JSON.stringify(S))+'</textarea><div class="flex" style="margin-top:8px"><button onclick="cp()">Kopieren</button><button onclick="imp()">Einfügen &amp; laden</button></div></div>';
 return h}
function addAth(){var n=document.getElementById("na").value.trim();if(!n)return;S.ath.push({id:uid(),name:n});save();render()}
function delAth(id){if(!confirm("Sportler und alle seine Einträge löschen?"))return;S.ath=S.ath.filter(function(a){return a.id!==id});S.logs=S.logs.filter(function(l){return l.a!==id});save();render()}
function addEx(){var n=document.getElementById("ne").value.trim();if(!n)return;S.lib.push({id:uid(),name:n,cat:document.getElementById("nc").value,reg:document.getElementById("nr").value,unit:document.getElementById("nu").value,bw:document.getElementById("nw").value==="1"});save();render();toast("Übung gespeichert")}
function cp(){var t=document.getElementById("bk");t.select();try{navigator.clipboard.writeText(t.value);toast("Kopiert")}catch(e){document.execCommand("copy")}}
function imp(){try{var o=JSON.parse(document.getElementById("bk").value);if(!o.ath||!o.lib||!o.logs)throw 0;S=o;save();render();toast("Geladen")}catch(e){toast("Text ist keine gültige Sicherung")}}
function el(i){return document.getElementById(i)}
function mode(e){return e.cat==="knoten"?"zeit":e.cat==="wurf"?"weite":"sum"}
function load(){try{var r=localStorage.getItem("kutter1");if(r)S=JSON.parse(r)}catch(e){}
 if(!S)S={ath:[],lib:DEF.map(function(d){return{id:uid(),cat:d[0],name:d[1],unit:d[2]}}),logs:[],plan:null,v:2,diary:[]};
 if(!S.diary)S.diary=[];
 if(S.v!==2){var used={};S.logs.forEach(function(l){used[l.ex]=1});
  S.lib=S.lib.filter(function(e){return !(e.cat==="tabata"&&!used[e.id])});
  DEF.forEach(function(d){if((d[0]==="tabata"||d[0]==="calis")&&!S.lib.some(function(e){return e.name===d[1]}))S.lib.push({id:uid(),cat:d[0],name:d[1],unit:d[2]})});
  S.plan=null;S.v=2;save()}}
function vLog(){
 if(!S.ath.length)return'<div class="card empty">Lege zuerst unter „Team“ deine Sportler an.</div>';
 if(!sel.ex||!lib(sel.ex))sel.ex=S.lib[0]&&S.lib[0].id;
 var e=lib(sel.ex),m=mode(e),pa=present(),a0=att();

 if(S.ath.length>1)h+='<details class="card"'+(sel.ao?' open':'')+' ontoggle="sel.ao=this.open"><summary>Anwesend heute: '+(a0?pa.length:"alle")+' von '+S.ath.length+'</summary><div class="at">'+S.ath.map(function(x){return'<button class="'+(a0&&a0.indexOf(x.id)>=0?"on":"")+'" onclick="togAtt(\''+x.id+'\')">'+esc(x.name)+'</button>'}).join("")+'</div><div class="flex" style="margin-top:8px"><button class="sm" onclick="togAtt(\'all\')">Alle da</button><button class="sm" onclick="togAtt(\'none\')">Zurücksetzen</button></div></details>';
 h+='<div class="card"><label>Datum</label><input type="date" id="ld" value="'+today()+'"><label>Übung</label><select onchange="sel.ex=this.value;render()">'+opts+'</select>'+tip(e);
 var ul=e.unit==="Wdh"?"Wdh":e.unit==="s"?"Sekunden":"Meter",bw=isBW(e);
 if(m==="sum"&&bw)h+='<p class="last" style="margin:6px 0 0">Körpergewicht-Übung: Bei „+ kg“ nur das Zusatzgewicht eintragen (Weste, Dip-Gürtel, Rucksack). Leer lassen = ohne Zusatzgewicht.</p>';
 if(m==="sum"){pa.forEach(function(a){var L=lastOf(a.id,sel.ex);
  if(sel.ind&&sel.ind[a.id]){var ls=lastSets(a.id,sel.ex),n0=ls.length||3,r='';
   for(var i=0;i<n0;i++)r+=setRow(a.id,i,ls[i],ul);
   h+='<div class="lr"><b>'+esc(a.name)+'</b>'+(L?'<div class="last">zuletzt '+fd(L.d)+': '+L.s+'×'+L.v+' '+e.unit+(L.kg?' · '+kgTxt(e,L.kg):'')+'</div>':'')+'<div id="sl_'+a.id+'">'+r+'</div><div class="flex" style="margin-top:6px"><button class="sm" onclick="addSet(\''+a.id+'\',-1)">− Satz</button><button class="sm" onclick="addSet(\''+a.id+'\',1)">+ Satz</button><button class="sm" onclick="togInd(\''+a.id+'\')">Alle gleich</button>'+(L?'<button class="sm" onclick="fillLast(\''+a.id+'\')">Wie letztes Mal</button>':'')+'</div></div>';return}
